name: Official Macro Collector

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-macro-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official macro observations
        run: python tools/collect-official-macro.py --write
      - name: Validate calendar
        run: |
          node tools/check-economic-calendar.js
          node tools/check-utf8-integrity.js
      - name: Persist new official snapshots
        run: |
          if git diff --quiet -- data/official-macro-snapshots.json; then
            echo "No official macro changes."
            exit 0
          fi
          git config user.name "tradealphaai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/official-macro-snapshots.json
          git commit -m "Update official macro snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
